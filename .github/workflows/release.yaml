# .github/workflows/release.yaml

name: kong.gateway release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Start Application
        uses: collinkleest/remote-release@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          command: |
            echo "KONG_PASSWORD=${{ secrets.KONG_PASSWORD }}" > .env
            echo "KONG_DB_USER=${{ secrets.KONG_DB_USER }}" >> .env
            echo "KONG_DB_PASSWORD=${{ secrets.KONG_DB_PASSWORD }}" >> .env
            docker compose down -v
            docker compose up -d
