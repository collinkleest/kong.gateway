_format_version: "3.0"

services:
  - name: liteproxy-service
    url: http://liteproxy-service:8082
    routes:
      - name: liteproxy-cors-route
        hosts:
          - api.liteproxy.collinkleest.com
        paths:
          - /proxy
        preserve_host: false
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          policy: local
          minute: 50
          second: 5

  - name: liteproxy-ui-service
    url: http://liteproxy-ui-service:3001
    routes:
      - name: liteproxy-ui-route
        hosts:
          - liteproxy.collinkleest.com
        paths:
          - ~/
        preserve_host: false
        strip_path: false

  - name: collinkleest.com
    url: http://collinkleest-website:3000
    routes:
      - name: collinkleest-website-route
        hosts:
          - collinkleest.com
          - www.collinkleest.com
        strip_path: false

  - name: fpl.app
    url: https://collinkleest.github.io
    routes:
      - name: fpl-app-route
        hosts:
          - fpl.betlab.app
        paths:
          - ~/fpl.app
        strip_path: false

routes:
  - name: fpl.app-redirect
    hosts:
      - fpl.betlab.app
    paths:
      - ~/
    plugins:
      - name: redirect
        config:
          status_code: 301
          location: https://fpl.betlab.app/fpl.app