_format_version: "3.0"

services:
  - name: liteproxy-service
    host: liteproxy-service
    port: 8082
    protocol: http
    routes:
      - name: liteproxy-cors-route
        hosts:
          - api.liteproxy.collinkleest.com
        paths:
          - /proxy
        preserve_host: false
        protocols:
          - http
          - https
        strip_path: false
    tags:
      - liteproxy
      - corsproxy
      - liteproxy.webservice
    plugins:
      - name: rate-limiting
        config:
          policy: local
          minute: 50
          second: 5

  - name: liteproxy-ui-service
    host: liteproxy-ui-service
    port: 3001
    protocol: http
    routes:
      - name: liteproxy-ui-route
        hosts:
          - liteproxy.collinkleest.com
        paths:
          - ~/
        preserve_host: false
        protocols:
          - http
          - https
        strip_path: false
    tags:
      - liteproxy.ui
      - liteproxy

  - name: collinkleest.com
    host: collinkleest-website
    port: 3000
    protocol: http
    routes:
      - name: collinkleest-website-route
        hosts:
          - collinkleest.com
          - www.collinkleest.com
        protocols:
          - http
          - https
        strip_path: false
    tags:
      - collinkleest.com
      - collinkleest-website
