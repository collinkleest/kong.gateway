_format_version: "3.0"
services:
  - name: liteproxy-service
    host: liteproxy-service
    port: 8082
    protocol: http
    routes:
      - name: liteproxy-cors-route
        hosts:
          - liteproxy.collinkleest.com
        paths:
          - /proxy
        preserve_host: false
        protocols:
          - http
          - https
        strip_path: false
    tags:
      - liteproxy
      - corsproxy
      - liteproxy.webservice

  - name: collinkleest.com
    host: collinkleest-website
    port: 3000
    protocol: http
    routes:
      - name: collinkleest-website-route
        hosts:
          - collinkleest.com
          - www.collinkleest.com
        protocols:
          - http
          - https
        strip_path: false
    tags:
      - collinkleest.com
      - collinkleest-website
