name: kong.gateway

networks:
  kong:
    driver: bridge
    name: kong-net

services:
  kong-database:
    container_name: kong-database
    image: postgres:13
    restart: always
    networks:
      - kong
    environment:
      - POSTGRES_USER=kong
      - POSTGRES_PASSWORD=kongpass
      - POSTGRES_DB=kong
    volumes:
      - kong-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong", "-d", "kong"]
      interval: 10s
      timeout: 5s
      retries: 5

  kong-migrations:
    image: kong:3.9.0
    command: kong migrations bootstrap && kong config db_import /kong/declarative/kong.yaml
    restart: on-failure
    networks:
      - kong
    volumes:
      - "${PWD}:/kong/declarative/"
    environment:
      - KONG_DATABASE=postgres
      - KONG_PG_HOST=kong-database
      - KONG_PG_USER=kong
      - KONG_PG_PASSWORD=kongpass
      - KONG_PG_DATABASE=kong
      - KONG_PG_TIMEOUT=60000 # Sets timeout to 60 seconds instead of default
      - KONG_PG_CONNECT_TIMEOUT=60000
    depends_on:
      kong-database:
        condition: service_healthy

  kong:
    container_name: kong-gateway
    image: kong:3.9.0
    restart: always
    networks:
      - kong
    volumes:
      - "${PWD}:/kong/declarative/"
    environment:
      - KONG_DATABASE=postgres
      - KONG_PG_HOST=kong-database
      - KONG_PG_USER=kong
      - KONG_PG_PASSWORD=kongpass
      - KONG_PG_DATABASE=kong
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=0.0.0.0:8001, 0.0.0.0:8444 ssl
      - KONG_PASSWORD=${KONG_PASSWORD}
      - KONG_PG_TIMEOUT=60000 # Sets timeout to 60 seconds instead of default
      - KONG_PG_CONNECT_TIMEOUT=60000
    ports:
      - 8000:8000
      - 8443:8443
      - 8002:8002
      - 8001:8001
      - 8444:8444
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 120s
      timeout: 10s
      retries: 3

volumes:
  kong-data:
